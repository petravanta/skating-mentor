<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172129" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Skating Mentor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with tabs over one working column; skill map is a scrollable left-to-right progression graph; skill detail opens as a side sheet (bottom sheet on phones). */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --accent:#c2306f; --accent-ink:#ffffff; --accent-soft:#f8dde8;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --accent:#f0679f; --accent-ink:#1a0710; --accent-soft:#3d1a2a;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --accent:#f0679f; --accent-ink:#1a0710; --accent-soft:#3d1a2a;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.wheel{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
/* context bar */
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
/* plan */
.plan{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:start}
.item .slot{grid-row:1/span 3;width:52px;text-align:center;padding-top:2px}
.item .slot b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.item .slot span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.role.warm{color:var(--lv-dev)} .role.work{color:var(--lv-learn)} .role.new{color:var(--accent)} .role.review{color:var(--lv-conf)} .role.off{color:var(--muted)} .role.fav{color:var(--accent)}
.star{background:none;border:0;padding:0 4px;font-size:19px;line-height:1;color:var(--faint)}.star:hover,.star[aria-pressed="true"]{color:var(--accent)}
.btn .star-ico{color:var(--accent)}
.item .name{font-weight:700;font-size:17px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.item .name:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.item .why{color:var(--muted);font-size:14px}
.item ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.item .lvl{grid-column:3;grid-row:1}
.illus{margin:0;color:var(--ink)}.illus svg{display:block;width:100%;height:auto}
.illus.one{max-width:300px}
.illus.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.illus.strip figure{margin:0;scroll-snap-align:start}.illus figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.item .illus{grid-column:2/span 2;margin-top:6px}.item .illus.one{max-width:220px}
.rate{grid-column:2/span 2;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.rate .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.rate button{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:4px 9px;font-size:13px;font-weight:600}
.rate button:hover{border-color:var(--accent)}
.logged{font-size:13px;color:var(--lv-conf);font-weight:600}
.rate button.mark{border-color:var(--lv-conf);color:var(--lv-conf)}
.item .lvl{display:flex;gap:6px;align-items:center}
.item .rm{background:none;border:0;padding:0 4px;font-size:20px;line-height:1;color:var(--muted)}.item .rm:hover{color:var(--danger)}
.item.done{background:var(--sunk)}.item.done .name{text-decoration:line-through;text-decoration-color:var(--muted)}
.item.done .why,.item.done ul,.item.done .illus{display:none}
.addpick{max-width:420px}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr) auto}.item .slot{grid-row:auto;grid-column:1/span 2;text-align:left;width:auto;display:flex;gap:6px;align-items:baseline}.item .slot b{display:inline;font-size:14px}.item .role{grid-column:1;grid-row:2}.item .lvl{grid-column:2;grid-row:2}.item>.name,.item>.why,.item>ul,.item>.illus,.rate{grid-column:1/-1!important}}
/* level pill */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill .pct{font-family:var(--f-mono);font-weight:500}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.pill.lock{background:none;border:1px dashed var(--line)}
.hint-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hint-list button{background:none;border:0;padding:0;text-align:left;color:var(--ink);font-weight:600}
.hint-list button:hover{color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
/* map */
.maptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:72vh;position:relative;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.mapbox svg{display:block}
.edge{fill:none;stroke:var(--line);stroke-width:1.6}
.edge.on{stroke:var(--accent);stroke-width:2.2}
.edge.dim{opacity:.25}
.node{cursor:pointer}
.node rect.bg{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node text{fill:var(--ink);font-family:var(--f-body);font-size:12.5px;font-weight:600}
.node text.sub{fill:var(--muted);font-size:10.5px;font-weight:500;font-family:var(--f-mono)}
.node rect.bar-bg{fill:var(--sunk)}
.node.locked rect.bg{stroke-dasharray:4 3;fill:var(--bg)}
.node.locked text{fill:var(--faint)}
.node.ready rect.bg{stroke:var(--accent);stroke-width:2}
.node.l1 rect.bg{fill:var(--lv-learn-bg);stroke:var(--lv-learn)}
.node.l2 rect.bg{fill:var(--lv-dev-bg);stroke:var(--lv-dev)}
.node.l3 rect.bg{fill:var(--lv-conf-bg);stroke:var(--lv-conf)}
.node.l4 rect.bg{fill:var(--lv-solid-bg);stroke:var(--lv-solid)}
.node.l1 rect.bar{fill:var(--lv-learn)} .node.l2 rect.bar{fill:var(--lv-dev)} .node.l3 rect.bar{fill:var(--lv-conf)} .node.l4 rect.bar{fill:var(--lv-solid)}
.node.ctxblock{opacity:.55}
.node.faded{opacity:.5}
.node.dim{opacity:.22}
.node.sel rect.bg{stroke:var(--accent);stroke-width:3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:1.5px solid}
.colhead{fill:var(--faint);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em}
/* list */
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .nm{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink)}
.dots{font-family:var(--f-mono);color:var(--faint);font-size:12px;letter-spacing:1px}
.srow select{font-size:13px;padding:4px 6px}
@media (max-width:520px){.srow{grid-template-columns:auto minmax(0,1fr) auto}.srow .dots{display:none}}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul{margin:0;padding-left:18px}
.linklist{display:flex;flex-direction:column;gap:6px}
.linklist button{background:none;border:0;padding:0;display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;color:var(--ink);font-weight:600;width:100%}
.linklist button:hover span:first-child{color:var(--accent)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.hist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:8px}
/* history */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day h3{margin-bottom:6px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.entry .note{font-size:13px;grid-column:1/span 2;font-style:italic;color:var(--muted)}
/* gear */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.photo{display:flex;flex-direction:column;gap:8px;border-radius:10px;outline:2px dashed transparent;outline-offset:3px}
.photo.dragging{outline-color:var(--accent);background:var(--accent-soft)}
.photo img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--sunk);border-radius:8px;border:1px solid var(--line)}
.photo>span{display:grid;place-items:center;aspect-ratio:4/3;max-height:120px;border:1px dashed var(--line);border-radius:8px;background:var(--sunk)}
.ctx-photos{margin-top:12px}
.ctx-photos img{width:88px;height:66px;object-fit:contain;background:var(--sunk);border-radius:6px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
.themepick{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.themepick summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
.themepick summary::-webkit-details-marker{display:none}
.themepick summary .lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.themepick summary .chg{font-size:13px;color:var(--accent);font-weight:600}
.themepick[open] summary .chg{color:var(--muted)}
.themepick .row{margin-top:10px}
.themepick p{margin-top:8px}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10.5px;letter-spacing:.06em;vertical-align:1px}
.theme-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.theme-row:last-child{border-bottom:0}
.theme-row .nm,.link{background:none;border:0;padding:0;font:inherit;color:var(--ink);font-weight:600;text-align:left}
.link{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.theme-row .nm:hover,.link:hover{color:var(--accent)}
.load-error{margin:16px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
</style>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="https://petravanta.github.io/general/">All apps</a>
      <div class="brand">
        <svg class="wheel" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><circle cx="16" cy="16" r="7.5" fill="var(--surface)"/><circle cx="16" cy="16" r="3" fill="var(--ink)"/></svg>
        Skating Mentor
      </div>
      <span class="save-state" id="saveState">Loading…</span>
      <button class="btn sm" id="driveResume" data-act="driveSync" hidden>Resume Drive sync</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="map" aria-selected="false">Skill map</button>
      <button role="tab" data-tab="log" aria-selected="false">Progress log</button>
      <button role="tab" data-tab="gear" aria-selected="false">Skates, spots &amp; styles</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
/* ---------------- Catalog ---------------- */
// Skills live in data/skills.json so anyone can review or add to them in a pull request (see CONTRIBUTING.md).
async function loadCatalog(names){
  const out={};
  await Promise.all(names.map(async n=>{const r=await fetch('data/'+n+'.json'); if(!r.ok) throw new Error(n); out[n]=await r.json()}));
  return out;
}
(async()=>{
const CATALOG=await loadCatalog(['skills']).catch(e=>{
  document.body.insertAdjacentHTML('afterbegin','<p class="load-error" role="alert">Couldn’t load the skill list. Check your connection and reload.</p>');
  throw e});
// Focus themes are optional: without them the app plans sessions as before
const THEME_DATA=await fetch('data/themes.json').then(r=>r.ok?r.json():[]).catch(()=>[]);

/* ---------------- Skill graph ---------------- */
const STYLES={
  F:{n:'Foundations'}, C:{n:'Cruising & fitness'}, P:{n:'Park'}, S:{n:'Street'},
  D:{n:'Dance & artistic'}, L:{n:'Slalom & freestyle'}, O:{n:'Off-skate'}
};
const FEAT={
  space:{n:'Open flat space',a:'open space'}, wall:{n:'Wall or rail to hold',a:'something to hold'}, cones:{n:'Cones or cups',a:'cones'},
  slope:{n:'Gentle slope',a:'a slope'}, curb:{n:'Curb',a:'a curb'}, ledge:{n:'Ledge or box',a:'a ledge'}, rail:{n:'Rail',a:'a rail'},

/* ===== Google sign-in shared by petravanta's apps =====
   Canonical copy: https://github.com/petravanta/general/blob/main/shared/google-token.js (see STANDARDS.md, "Staying connected to Google Drive").
   Every app lives on petravanta.github.io and uses the same OAuth client, so a Drive token one app gets works in all of them.
   This keeps that token where every app can see it (localStorage key petravanta.google), one per Google account, so
   reconnecting in one app reconnects them all, and an app only ever uses the token of the account it connected with.
   Google gives a static site no refresh token: a token lasts an hour, and getting a new one opens Google's window,
   which browsers only allow right after a tap. With the account's email as a hint, that window closes by itself. */
const GoogleToken=(()=>{
  const KEY='petravanta.google', SCOPE='https://www.googleapis.com/auth/drive.file';
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch(e){return {}}};
  const write=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};
  const subs=[];
  // Another tab or app on this site got a token: let this one pick it up without a tap
  window.addEventListener('storage',e=>{if(e.key===KEY) subs.forEach(f=>{try{f()}catch(_){}})});
  function gis(){return new Promise((res,rej)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2) return res();
    const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.onload=res; s.onerror=()=>rej({code:'offline'}); document.head.appendChild(s)})}
  // A token for this account with time left on it, or null
  function get(email){const t=email&&(read().tokens||{})[email]; return t&&t.exp>Date.now()?t:null}
  // o: {clientId, hint:'email to suggest', prompt:'' | 'select_account' | 'consent'}. Call from a tap. Resolves {token, exp, email}.
  function request(o){return new Promise(async(res,rej)=>{
    try{await gis()}catch(e){return rej(e)}
    google.accounts.oauth2.initTokenClient({client_id:o.clientId,scope:SCOPE,login_hint:o.hint||undefined,error_callback:rej,
      callback:async r=>{
        if(r.error) return rej(r);
        const t={token:r.access_token,exp:Date.now()+(Number(r.expires_in||3600)-60)*1000};
        // Which account it is, so the token is filed under the right one
        let email='';
        try{const j=await (await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:{Authorization:'Bearer '+t.token}})).json(); email=(j.user&&j.user.emailAddress)||''}catch(e){}
        if(!email) email=o.hint||'';
        if(email){
          const v=read(), now=Date.now(); v.tokens=v.tokens||{};
          for(const k in v.tokens) if(!(v.tokens[k].exp>now)) delete v.tokens[k];
          v.tokens[email]=t; v.last=email; write(v);
        }
        res({...t,email});
      }
    }).requestAccessToken({prompt:o.prompt||''});
  })}
  // Signing out on this browser. Google's permission stays, since the other apps and devices still use it.
  function forget(email){const v=read(); if(v.tokens&&email) delete v.tokens[email]; write(v)}
  return {get,request,forget,gis,onChange:f=>subs.push(f),get lastEmail(){return read().last||''}};
})();
/* ===== end Google sign-in ===== */

// Combine what's in Drive with what's in this browser: every log from both (minus deletions), the newer profile, all photos still in use
function mergeRemote(r){
  if(!r||!r.profile) return false;
  const del=new Set([...(state.deleted||[]),...(r.deleted||[])]);
  const byId=new Map(); [...(r.logs||[]),...state.logs].forEach(l=>{if(l&&l.id&&!del.has(l.id))byId.set(l.id,l)});
  const before=JSON.stringify([state.profile,state.logs.length]);

  if(newer) state.profile=Object.assign(defaultProfile(),r.profile);

/* ---------------- Confidence model ---------------- */
const DAY=86400000;
let CONF={};
function computeConf(){
  const by={};
  [...state.logs].sort((a,b)=>a.ts<b.ts?-1:1).forEach(l=>{(by[l.skill]=by[l.skill]||[]).push(l)});
  CONF={};
  for(const id in by){
    let v=0,n=0,last=null,sessions=0;
    for(const l of by[id]){
      if(l.base!=null){ if(l.base===0){v=0;n=0} else {v=l.base;n=3} }
      else { const r=l.r/5*100; v=n===0?r:v*0.6+r*0.4; n++; sessions++ }
      last=l.ts;
    }
    if(n===0){continue}
    const days=(Date.now()-new Date(last).getTime())/DAY;
    const fresh=Math.max(0.8,1-Math.max(0,days-14)/365*0.5);
    const c=Math.round(v*Math.min(1,0.6+0.2*(n-1))*fresh);
    CONF[id]={c:Math.max(1,c),last,days,sessions};
  }
}

function spotSummary(skate,spot){
  const f=spot.features.map(x=>FEAT[x]?FEAT[x].n.toLowerCase():x);
  const sk=skate?`${skate.type==='inline'?'Inline':'Quad'}, ${skate.brake==='heel'?'heel brake':skate.brake==='toe'?'toe stops':'no brake'}${skate.grind?', grind-ready':''}`:'Off skates';
  return `${sk} at ${SURF[spot.surface].toLowerCase()}${f.length?' with '+f.join(', '):''}.`;
}

/* ----- Skill map ----- */
function visibleSet(){
  const th=mapStyle.startsWith('t:')&&THEME_BY[mapStyle.slice(2)];
  const base=SKILLS.filter(s=>th?th.ids.includes(s.id):mapStyle==='all'?true:mapStyle==='mine'?styleOn(s):s.st===mapStyle);
  const set=new Set(base.map(s=>s.id)), anc=new Set();
  const up=id=>BYID[id].req.forEach(r=>{if(!set.has(r)&&!anc.has(r)){anc.add(r)}up(r)});
  base.forEach(s=>up(s.id));
  return {ids:[...set,...anc],faded:anc};
}
function viewMap(){
  const mapTheme=mapStyle.startsWith('t:')?THEME_BY[mapStyle.slice(2)]:null;
  const chips=[['mine','My styles'],['all','Everything'],...Object.entries(STYLES).map(([k,v])=>[k,v.n])];
  const head=`<div class="row" style="justify-content:space-between"><h2>Skill map</h2>
    <div class="row"><button class="chip" aria-pressed="${mapView==='map'}" data-mapview="map">Map</button><button class="chip" aria-pressed="${mapView==='list'}" data-mapview="list">List &amp; set levels</button></div></div>

    ${THEMES.length?`<div class="maptools"><span class="small muted" style="margin-right:2px">Themes</span>${THEMES.map(th=>`<button class="chip" aria-pressed="${mapStyle==='t:'+th.id}" data-mapstyle="t:${th.id}">${themesOn().includes(th.id)?'◆ ':''}${esc(th.n)}</button>`).join('')}</div>`:''}
    ${mapTheme?`<section class="panel"><p class="small muted">${esc(mapTheme.desc)}${themesOn().includes(mapTheme.id)?' One of your focus themes.':''}</p>${themeBar(mapTheme,false)}
      ${themesOn().includes(mapTheme.id)?'':`<button class="btn sm" data-focustheme="${mapTheme.id}">Focus on ${esc(mapTheme.n)}</button>`}</section>`:''}`;

  return `<div class="stack">${head}
    <div class="row" style="justify-content:space-between">
      <div class="legend"><span><i style="border-color:var(--line);border-style:dashed"></i>Locked</span><span><i style="border-color:var(--accent)"></i>Ready to start</span>
      <span><i style="border-color:var(--lv-learn);background:var(--lv-learn-bg)"></i>Learning</span><span><i style="border-color:var(--lv-dev);background:var(--lv-dev-bg)"></i>Developing</span>
      <span><i style="border-color:var(--lv-conf);background:var(--lv-conf-bg)"></i>Confident</span><span><i style="border-color:var(--lv-solid);background:var(--lv-solid-bg)"></i>Solid</span></div>
      <div class="row"><button class="btn sm" data-zoom="-1" aria-label="Zoom out">−</button><button class="btn sm" data-zoom="1" aria-label="Zoom in">+</button></div>

    <p class="muted small">Left to right is progression: a skill unlocks once everything feeding into it reaches Developing (${UNLOCK}%). Faded skills belong to other styles${mapTheme?' or themes':''} but are needed here. Skills your current skates or spot can’t support are dimmed.</p>
  </div>`;
}
function drawMap(){
  const {ids,faded}=visibleSet(), vis=new Set(ids);
  const depth={};
  const dep=id=>{if(depth[id]!=null)return depth[id];const r=BYID[id].req.filter(x=>vis.has(x));return depth[id]=r.length?1+Math.max(...r.map(dep)):0};
  ids.forEach(dep);
  const cols=[]; ids.forEach(id=>{(cols[depth[id]]=cols[depth[id]]||[]).push(id)});
  const order=Object.keys(STYLES), pos={};
  const W=178,H=50,GX=58,GY=12,PX=20,PY=34;
  cols.forEach((col,ci)=>{
    col.sort((a,b)=>{
      const bc=id=>{const r=BYID[id].req.filter(x=>pos[x]!=null);return r.length?r.reduce((s,x)=>s+pos[x].y,0)/r.length:order.indexOf(BYID[id].st)*1000};
      return bc(a)-bc(b)||order.indexOf(BYID[a].st)-order.indexOf(BYID[b].st)||BYID[a].d-BYID[b].d;
    });
    col.forEach((id,ri)=>{pos[id]={x:PX+ci*(W+GX),y:PY+ri*(H+GY)}});
  });
  const width=PX*2+cols.length*(W+GX)-GX, height=PY+Math.max(...cols.map(c=>c.length))*(H+GY)+10;
  const skate=curSkate(), spot=curSpot();
  let rel=null;
  if(selected&&vis.has(selected)){rel=new Set([selected]);const up=id=>BYID[id].req.forEach(r=>{rel.add(r);up(r)});up(selected);descendants(selected).forEach(x=>rel.add(x))}
  let edges='', nodes='';
  ids.forEach(id=>BYID[id].req.filter(r=>vis.has(r)).forEach(r=>{
    const a=pos[r],b=pos[id], x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2, on=rel&&rel.has(id)&&rel.has(r);
    edges+=`<path class="edge${on?' on':rel?' dim':''}" d="M${x1} ${y1} C${x1+GX/2} ${y1},${x2-GX/2} ${y2},${x2} ${y2}"/>`;
  }));
  ids.forEach(id=>{
    const s=BYID[id],p=pos[id],c=conf(id),lv=levelOf(c),ul=unlocked(s);
    const cls=['node',c>0?'l'+lv:ul?'ready':'locked'];
    if(faded.has(id))cls.push('faded'); if(blocker(s,skate,spot)&&s.st!=='O')cls.push('ctxblock');
    if(rel&&!rel.has(id))cls.push('dim'); if(selected===id)cls.push('sel');
    const nm=(isFav(id)?'★ ':'')+s.n, name=nm.length>24?nm.slice(0,23)+'…':nm;
    nodes+=`<g class="${cls.join(' ')}" data-open="${id}" tabindex="0" role="button" aria-label="${esc(s.n)}">
      <rect class="bg" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8"/>
      <text x="${p.x+10}" y="${p.y+19}">${esc(name)}</text>
      <text class="sub" x="${p.x+10}" y="${p.y+35}">${esc(STYLES[s.st].n)} · ${dots(s.d)}</text>
      ${c>0?`<rect class="bar-bg" x="${p.x+10}" y="${p.y+41}" width="${W-20}" height="3" rx="1.5"/><rect class="bar" x="${p.x+10}" y="${p.y+41}" width="${(W-20)*c/100}" height="3" rx="1.5"/>`:''}
    </g>`;
  });
  const heads=cols.map((_,ci)=>`<text class="colhead" x="${PX+ci*(W+GX)}" y="20">STEP ${ci+1}</text>`).join('');
  const box=document.getElementById('mapbox');
  box.innerHTML=`<svg width="${width*zoom}" height="${height*zoom}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Skill progression graph">${heads}${edges}${nodes}</svg>`;
}
function viewList(){

          return `<div class="entry"><div><button class="nm" style="background:none;border:0;padding:0;font-weight:700;color:var(--ink)" data-open="${s.id}">${esc(s.n)}</button>
            <div class="meta">${l.base!=null?'Starting level: '+esc(LEVELS[BASELINE_CONF.indexOf(l.base)]?.n||''):esc(RATINGS[l.r])}${where?' · '+esc(where):''}</div></div>
            <div>${pendingDelete===l.id?`<button class="btn sm danger" data-del="${l.id}">Delete</button> <button class="btn sm ghost" data-delcancel="1">Keep</button>`:`<button class="btn sm ghost" data-delask="${l.id}" aria-label="Remove entry">Remove</button>`}</div>
            ${l.note?`<div class="note">${esc(l.note)}</div>`:''}</div>`}).join('')}</div>`).join(''):
        `<div class="empty">No practice logged yet. Rate a skill from today’s session, or open any skill on the map and log it.</div>`}
    </section>
  </div>`;
}

/* ----- Gear ----- */
function viewGear(){
  const p=state.profile;
  const sel=(attr,id,val,opts)=>`<select data-${attr}="${id}" data-key="${opts.key}">${opts.list.map(([v,l])=>`<option value="${v}"${v===val?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  return `<div class="stack">
    <section class="stack"><h2>Styles</h2>
      <p class="muted">Pick what you want to grow in. Foundations are always included.</p>
      <div class="row">${Object.entries(STYLES).filter(([k])=>k!=='F').map(([k,v])=>`<button class="chip" aria-pressed="${p.styles.includes(k)}" data-style="${k}">${esc(v.n)}</button>`).join('')}</div>
    </section>
    <section class="stack"><div class="row" style="justify-content:space-between"><h2>My skates</h2><button class="btn sm" data-act="addSkate">Add skates</button></div>
      <div class="cards">${p.skates.map(k=>`<div class="card">
        ${photoBlock('skate',k)}
        <input type="text" id="skn-${k.id}" value="${esc(k.name)}" data-skname="${k.id}" aria-label="Skate name">
        <div class="ctx" style="grid-template-columns:1fr 1fr">
          <label class="field">Type${sel('sk',k.id,k.type,{key:'type',list:[['inline','Inline'],['quad','Quad']]})}</label>
          <label class="field">Brake${sel('sk',k.id,k.brake,{key:'brake',list:[['heel','Heel brake'],['toe','Toe stops'],['none','None']]})}</label>
          <label class="field">Wheels${sel('sk',k.id,k.wheels,{key:'wheels',list:[['indoor','Hard / indoor'],['outdoor','Soft / outdoor'],['park','Park / aggressive']]})}</label>
          <label class="field">Grinding${sel('sk',k.id,k.grind?'1':'0',{key:'grind',list:[['0','Not set up'],['1','Grind-ready']]})}</label>
        </div>
        <div class="row"><button class="btn sm ghost danger" data-rmskate="${k.id}">Remove</button></div></div>`).join('')}</div>
    </section>
    <section class="stack"><div class="row" style="justify-content:space-between"><h2>My spots</h2><button class="btn sm" data-act="addSpot">Add spot</button></div>
      <div class="cards">${p.spots.map(k=>`<div class="card">
        ${photoBlock('spot',k)}
        <input type="text" id="spn-${k.id}" value="${esc(k.name)}" data-spname="${k.id}" aria-label="Spot name">
        <label class="field">Surface${sel('sp',k.id,k.surface,{key:'surface',list:Object.entries(SURF)})}</label>
        ${k.surface==='home'?'<p class="muted small">Off-skate exercises only.</p>':`<div class="checks">${Object.entries(FEAT).map(([f,v])=>`<label><input type="checkbox" data-feat="${f}" data-spot="${k.id}"${k.features.includes(f)?' checked':''}>${esc(v.n)}</label>`).join('')}</div>`}
        <div class="row"><button class="btn sm ghost danger" data-rmspot="${k.id}">Remove</button></div></div>`).join('')}</div>
    </section>
  </div>`;
}

/* ----- Settings ----- */
function viewSettings(){
  return `<div class="stack">
    <h2>Settings</h2>
    <section class="panel stack"><h3>Google Drive</h3>${drivePanel()}</section>
    <section class="panel stack"><h3>Backup &amp; reset</h3>
      <p class="small">${backend==='cloud'?'Your progress is saved to your account and follows you to other devices.':'Your progress is saved in this browser only. Export a backup if you switch devices.'} The backup is a plain file with your log, skates, spots and photos, and you can import it into any copy of this app.</p>
      <div class="row"><button class="btn sm" data-act="export">Export backup</button>
      <label class="btn sm" for="importFile" style="display:inline-block">Import backup</label><input type="file" id="importFile" accept="application/json,.json" hidden>
      ${pendingDelete==='ALL'?`<button class="btn sm danger" data-act="resetYes">Erase everything</button><button class="btn sm ghost" data-delcancel="1">Cancel</button>`:`<button class="btn sm ghost danger" data-act="resetAsk">Start over</button>`}</div>
    </section>
  </div>`;
}

/* ---------------- Events ---------------- */
async function setPhoto(kind,owner,file){
  const list=kind==='skate'?state.profile.skates:state.profile.spots, k=list.find(x=>x.id===owner);
  if(!k) return;
  if(!file.type.startsWith('image/')){toast('That file isn\u2019t an image.');return}
  try{const data=await shrinkImage(file); const old=k.photo; k.photo='ph'+uid6(); await savePhoto(k.photo,data); await dropPhoto(old); touchProfile(); render(); toast('Photo saved')}
  catch(_){toast('That file couldn\u2019t be read as an image.')}
}
// Drag an image file onto a skate or spot photo box
const dropZone=e=>e.target.closest&&e.target.closest('[data-drop]');
document.addEventListener('dragover',e=>{const z=dropZone(e);if(!z)return;e.preventDefault();e.dataTransfer.dropEffect='copy';z.classList.add('dragging')});
document.addEventListener('dragleave',e=>{const z=dropZone(e);if(z&&!z.contains(e.relatedTarget))z.classList.remove('dragging')});
document.addEventListener('drop',e=>{const z=dropZone(e);if(!z)return;e.preventDefault();z.classList.remove('dragging');
  const f=[...(e.dataTransfer.files||[])][0]; if(f) setPhoto(z.dataset.drop,z.dataset.owner,f); else toast('Drop an image file from your computer.')});
function toast(t){const h=document.getElementById('toastHost');h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600)}
function touchProfile(){state.profile.examples=false;saveProfile()}
async function logRating(skill,r,note){
  const c=state.profile.ctx;
  const log={id:uid6(),ts:new Date().toISOString(),skill,r,skate:c.skate,spot:c.spot}; if(note) log.note=note;
  const before=levelOf(conf(skill)), wasLocked=(CHILDREN[skill]||[]).filter(k=>!unlocked(BYID[k]));
  await saveLog(log); computeConf();
  const after=levelOf(conf(skill)), opened=wasLocked.filter(k=>unlocked(BYID[k]));
  toast(opened.length?`Unlocked: ${opened.map(k=>BYID[k].n).join(', ')}`:after>before?`${BYID[skill].n} is now ${LEVELS[after].n}`:`Logged ${BYID[skill].n}`);
  return log;
}
async function setBaseline(skill,lv){
  const c=state.profile.ctx;
  await saveLog({id:uid6(),ts:new Date().toISOString(),skill,base:BASELINE_CONF[lv],skate:c.skate,spot:c.spot});
  state.profile.examples=false; saveProfile();
  render();
}
// Google tokens last an hour. Renew on a tap when it's close to running out: a token request needs a tap,
// and for an account that already agreed Google's window closes by itself.
document.addEventListener('click',e=>{
  if(!driveConfigured()||!Drive.on||Drive.busy||e.target.closest('[data-act^="drive"],#driveResume')) return;
  driveLive(); if(Drive.exp-Date.now()>10*60000||Date.now()-Drive.lastAsk<5*60000) return;
  Drive.lastAsk=Date.now(); driveToken().then(()=>driveSync(false)).catch(()=>showDriveStatus());
},true);
// Another app or tab reconnected this account: carry on with its token
GoogleToken.onChange(()=>{if(driveConfigured()&&Drive.on&&driveLive()) driveSync(false); else showDriveStatus()});
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-open],[data-close]'); if(!t) return;
  const d=t.dataset;
  if(d.tab){tab=d.tab;selected=null;try{sessionStorage.setItem('sm.tab',tab)}catch(_){};render();window.scrollTo(0,0);return}
  if(d.goto){tab=d.goto;if(d.list)mapView='list';render();return}
  if(d.close){selected=null;render();return}
  if(d.fav){toggleFav(d.fav);return}
  if(d.focustheme){toggleTheme(d.focustheme);return}
  if(d.themeview){tab='map';mapStyle='t:'+d.themeview;selected=null;try{sessionStorage.setItem('sm.tab',tab)}catch(_){};render();window.scrollTo(0,0);return}
  if(d.open){selected=d.open;render();return}
  if(d.rate){
    const it=planCache.items[+d.item];
    const log=await logRating(it.id,+d.rate);
    it.done={r:+d.rate,log:log.id}; savePlan(); return}
  if(d.markdone){planCache.items[+d.markdone].done={r:0}; savePlan(); return}
  if(d.undo){const it=planCache.items[+d.undo], dn=it&&it.done; if(dn){if(dn.log) await removeLog(dn.log);delete it.done;savePlan()} return}
  if(d.rmitem){planCache.items.splice(+d.rmitem,1); savePlan(); return}
  if(d.addplan){addToPlan(d.addplan); selected=null; tab='today'; render(); toast(BYID[d.addplan].n+' added to today'); return}
  if(d.logskill){const note=(document.getElementById('logNote')||{}).value||''; await logRating(d.logskill,+d.r,note.trim()); render(); return}
  if(d.act==='shuffle'){reshuffle();return}
  if(d.mapview){mapView=d.mapview;render();return}
  if(d.mapstyle){mapStyle=d.mapstyle;render();return}
  if(d.zoom){zoom=Math.min(1.6,Math.max(0.5,zoom+(+d.zoom)*0.15));drawMap();return}
  if(d.style){const s=state.profile.styles;const i=s.indexOf(d.style);i>=0?s.splice(i,1):s.push(d.style);touchProfile();render();return}
  if(d.act==='addSkate'){const id='sk'+uid6();state.profile.skates.push({id,name:'New skates',type:'inline',brake:'heel',grind:false,wheels:'outdoor'});touchProfile();render();return}
  if(d.act==='addSpot'){const id='sp'+uid6();state.profile.spots.push({id,name:'New spot',surface:'smooth',features:['space']});touchProfile();render();return}
  if(d.rmphoto){const list=d.rmphoto==='skate'?state.profile.skates:state.profile.spots, k=list.find(x=>x.id===d.owner); await dropPhoto(k.photo); delete k.photo; touchProfile(); render(); return}
  if(d.rmskate){const p=state.profile;dropPhoto((p.skates.find(k=>k.id===d.rmskate)||{}).photo);p.skates=p.skates.filter(k=>k.id!==d.rmskate);if(p.ctx.skate===d.rmskate)p.ctx.skate=p.skates[0]?p.skates[0].id:'none';touchProfile();render();return}
  if(d.rmspot){const p=state.profile;if(p.spots.length<=1){toast('Keep at least one spot.');return}dropPhoto((p.spots.find(k=>k.id===d.rmspot)||{}).photo);p.spots=p.spots.filter(k=>k.id!==d.rmspot);if(p.ctx.spot===d.rmspot)p.ctx.spot=p.spots[0].id;touchProfile();render();return}
  if(d.delask){pendingDelete=d.delask;render();return}
  if(d.delcancel){pendingDelete=null;render();return}
  if(d.del){pendingDelete=null;await removeLog(d.del);toast('Entry removed');render();return}
  if(d.act==='resetAsk'){pendingDelete='ALL';render();return}
  if(d.act==='resetYes'){
    const ids=state.logs.map(l=>l.id); const phIds=Object.keys(state.photos); state={profile:defaultProfile(),logs:[],photos:{},deleted:state.deleted.concat(ids)}; pendingDelete=null; planCache=null; saveLocal(); saveProfile();
    if(backend==='cloud'){for(const id of ids){try{await logsCol.doc(id).delete()}catch(_){}}for(const id of phIds){try{await photosCol.doc(id).delete()}catch(_){}}}
    toast('Everything erased');render();return}
  if(d.act==='driveConnect'||d.act==='driveSync'){driveSync(true);return}
  if(d.act==='driveOff'){driveDisconnect();return}
  if(d.act==='export'){
    const data=JSON.stringify({app:'skating-mentor',exported:new Date().toISOString(),...state},null,2);
    try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
      if(!dl) throw 0; await dl.save({filename:'skating-mentor-backup.json',data}); toast('Backup saved')}
    catch(err){ if(err&&err.code==='declined') return;
      try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='skating-mentor-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
      catch(_){try{await navigator.clipboard.writeText(data);toast('Backup copied to clipboard')}catch(__){toast('Export isn\u2019t available here')}}}
    return}
});
document.addEventListener('toggle',e=>{if(e.target.id==='themePick'){themeOpen=e.target.open;const c=e.target.querySelector('.chg');if(c)c.textContent=themeOpen?'Done':themesOn().length?'Change':'Choose'}},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&selected){selected=null;render()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-open]')){e.preventDefault();selected=e.target.dataset.open;render()}
});
document.addEventListener('change',async e=>{
  const t=e.target, d=t.dataset;
  if(d.addpick&&t.value){addToPlan(t.value);return}
  if(d.ctx){state.profile.ctx[d.ctx]=d.ctx==='minutes'?+t.value:t.value;saveProfile();render();return}
  if(d.baseline){await setBaseline(d.baseline,+t.value);toast(`${BYID[d.baseline].n}: ${LEVELS[+t.value].n}`);return}
  if(d.sk){const k=state.profile.skates.find(x=>x.id===d.sk);k[d.key]=d.key==='grind'?t.value==='1':t.value;touchProfile();render();return}
  if(d.sp){const k=state.profile.spots.find(x=>x.id===d.sp);k[d.key]=t.value;touchProfile();render();return}
  if(d.feat){const k=state.profile.spots.find(x=>x.id===d.spot);const i=k.features.indexOf(d.feat);t.checked?(i<0&&k.features.push(d.feat)):(i>=0&&k.features.splice(i,1));touchProfile();return}
  if(d.photo&&t.files[0]){await setPhoto(d.photo,d.owner,t.files[0]);return}
  if(t.id==='importFile'&&t.files[0]){
    try{const j=JSON.parse(await t.files[0].text()); if(!j.profile||!Array.isArray(j.logs)) throw 0;
      const have=new Set(state.logs.map(l=>l.id)); const add=j.logs.filter(l=>l&&l.id&&l.skill&&!have.has(l.id));
      state.profile=Object.assign(defaultProfile(),j.profile);
      for(const [k,v] of Object.entries(j.photos||{})){if(typeof v==='string'&&v.startsWith('data:image/'))await savePhoto(k,v)}
      saveProfile();
      for(const l of add) await saveLog(l);
      planCache=null; toast(`Imported ${add.length} entries`); render();
    }catch(_){toast('That file isn’t a Skating Mentor backup.')}
  }
});
document.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d.skname){state.profile.skates.find(x=>x.id===d.skname).name=e.target.value;touchProfile()}
  if(d.spname){state.profile.spots.find(x=>x.id===d.spname).name=e.target.value;touchProfile()}
});

render();
setSaveState(backend==='cloud'?'Saved to your account':'Connecting…');
initCloud();
showDriveStatus();
if(driveConfigured()&&Drive.on){
  GoogleToken.gis().catch(()=>{});    // ready for the next tap-to-renew
  if(driveLive()) driveSync(false);   // pick up changes made on other devices
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&driveLive()) driveSync(false)});
}
})();
</script>
