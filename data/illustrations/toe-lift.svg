<svg xmlns="http://www.w3.org/2000/svg" class="illu" viewBox="0 0 240 180" role="img" aria-label="Toe lifts: back on the wall, heels a foot out, toes lifted toward the shins">
<title>Toe lifts: back on the wall, heels a foot out, toes lifted toward the shins</title>
<style>
